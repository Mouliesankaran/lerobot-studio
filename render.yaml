# ==============================================================================
# Render Infrastructure Blueprint - SO-101 Robotics & Vision Suite
# Free Static Site Hosting with Global CDN & Auto-SSL
# ==============================================================================

services:
  - type: web
    name: so101-robotics-dashboard
    runtime: static
    buildCommand: ""
    staticPublishPath: ./web
    pullRequestPreviewsEnabled: true
    routes:
      # Single-Page Application (SPA) fallback routing
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
